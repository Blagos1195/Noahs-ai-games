name: Train

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-four-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Train AI
        run: |
          RESUME=""
          if [ -f models/connect4_ntuple.npz ]; then
            RESUME="--resume models/connect4_ntuple.npz"
          fi
          python main.py --games 100000000 --time-limit-minutes 345 --search-depth 4 --epsilon-start 0.25 --epsilon-end 0.03 --eval-every-minutes 15 --eval-games 100 --save-every-minutes 5 --seed "$GITHUB_RUN_NUMBER" $RESUME

      - name: Save training results
        uses: actions/upload-artifact@v4
        with:
          name: connect-four-training-results
          path: |
            training_connect4.csv
            models/connect4_ntuple.npz
          if-no-files-found: error

      - name: Publish model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MODEL_BACKUP="$RUNNER_TEMP/connect4_ntuple.npz"
          cp models/connect4_ntuple.npz "$MODEL_BACKUP"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            git reset --hard origin/main
            cp "$MODEL_BACKUP" models/connect4_ntuple.npz
            git add models/connect4_ntuple.npz
            if git diff --cached --quiet; then
              echo "Model is unchanged."
              exit 0
            fi
            git commit -m "Update Connect Four AI model"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
