name: Train From Scratch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-four-from-scratch
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Train a fresh depth-two model
        run: |
          python main.py --games 100000000 --time-limit-minutes 345 --search-depth 2 --alpha 0.02 --epsilon-start 0.25 --epsilon-end 0.02 --eval-every-minutes 30 --eval-games 100 --eval-seed 100000 --save-every-minutes 5 --seed "$GITHUB_RUN_NUMBER" --output models/candidates/latest.npz --best-output models/candidates/best.npz --log training_from_scratch.csv

      - name: Save candidate and training history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-four-from-scratch
          path: |
            models/candidates/latest.npz
            models/candidates/best.npz
            training_from_scratch.csv
          if-no-files-found: warn
          retention-days: 90
